<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.mono, .mono text { font-family: "IBM Plex Mono"; white-space: pre; }
.sans { font-family: "IBM Plex Sans"; }
</style></head>
<body>
<div class="left">
  <img class="logo" src="logo-dark.svg" alt="CivOps">
  <div class="kicker">OPEN SOURCE · i3X MEDIA BRIDGE</div>
  <h1>Cameras<br><span>in i3X</span></h1>
  <div class="tag">Live video and audio through MediaMTX: health as values, a signed link per viewer, a clip when an alarm trips.</div>
  <div class="chips">
    <span class="chip on">MediaMTX</span>
    <span class="chip">RTSP · WebRTC · HLS</span>
    <span class="chip">No publishing</span>
    <span class="chip">Alarm → clip</span>
    <span class="chip">MIT</span>
  </div>
</div>
<svg class="art" viewBox="0 0 820 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563eb" stop-opacity=".45"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#93c5fd"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
  </defs>
  <circle cx="420" cy="380" r="330" fill="url(#glow)"/>

  <!-- camera -->
  <g transform="translate(20 104)">
    <rect width="150" height="96" rx="14" fill="#172338" stroke="#334a6e" stroke-width="2"/>
    <g transform="translate(30 26)">
      <rect width="64" height="44" rx="8" fill="none" stroke="#f1f5f9" stroke-width="3"/>
      <path d="M64 14 L92 2 L92 42 L64 30 Z" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="14" cy="12" r="4" fill="#ef4444"/>
    </g>
    <text x="75" y="126" text-anchor="middle" class="sans" font-weight="600" font-size="19" fill="#f1f5f9">Line 2 camera</text>
  </g>
  <path d="M174 152 L 268 152" stroke="#93c5fd" stroke-width="3" marker-end="url(#arr)"/>
  <text x="221" y="140" text-anchor="middle" class="mono" font-size="14" fill="#a5b4c8">RTSP pull</text>

  <!-- gateway -->
  <g transform="translate(276 92)">
    <rect width="200" height="120" rx="14" fill="#172338" stroke="#3b82f6" stroke-width="3"/>
    <text x="100" y="50" text-anchor="middle" class="sans" font-weight="700" font-size="26" fill="#f1f5f9">MediaMTX</text>
    <text x="100" y="80" text-anchor="middle" class="mono" font-size="14" fill="#a5b4c8">rolling recording</text>
    <circle cx="70" cy="100" r="5" fill="#ef4444"/><text x="82" y="105" class="mono" font-size="13" fill="#a5b4c8">REC</text>
  </g>
  <!-- nobody publishes -->
  <path d="M376 28 L 376 84" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrR)"/>
  <text x="392" y="48" class="mono" font-size="14" fill="#ef4444">publish → 401</text>

  <!-- viewers -->
  <path d="M480 128 L 572 98" stroke="#93c5fd" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M480 176 L 572 214" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrR)"/>
  <g transform="translate(580 36)">
    <rect width="230" height="124" rx="12" fill="#131e33" stroke="#22c55e" stroke-width="2"/>
    <rect x="12" y="12" width="206" height="72" rx="6" fill="#0b1324"/>
    <g opacity=".85"><rect x="12" y="12" width="29" height="72" fill="#f1f5f9"/><rect x="41" y="12" width="30" height="72" fill="#facc15"/><rect x="71" y="12" width="29" height="72" fill="#22d3ee"/><rect x="100" y="12" width="30" height="72" fill="#22c55e"/><rect x="130" y="12" width="29" height="72" fill="#d946ef"/><rect x="159" y="12" width="30" height="72" fill="#ef4444"/><rect x="189" y="12" width="29" height="72" fill="#3b82f6"/></g>
    <text x="14" y="108" class="mono" font-size="14" fill="#22c55e">?token=1762…  200</text>
  </g>
  <g transform="translate(580 190)">
    <rect width="230" height="64" rx="12" fill="#131e33" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="14" y="28" class="mono" font-size="14" fill="#ef4444">no token        401</text>
    <text x="14" y="50" class="mono" font-size="14" fill="#ef4444">other stream's  401</text>
  </g>

  <!-- health as i3X values -->
  <path d="M376 216 L 376 300" stroke="#93c5fd" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(150 310)">
    <rect width="452" height="196" rx="14" fill="#131e33" stroke="#334a6e"/>
    <g transform="translate(400 30)">
      <polygon points="-26,0 -13,-22 13,-22 26,0 13,22 -13,22" fill="#172338" stroke="#3b82f6" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-weight="600" font-size="13" fill="#f1f5f9">i3X</text>
    </g>
    <text x="22" y="36" class="mono" font-size="15" fill="#6b7d96">stream health, read like any tag</text>
    <g class="mono" font-size="17">
      <text x="22" y="80" fill="#a5b4c8">online       <tspan fill="#f1f5f9">true</tspan></text>
      <text x="22" y="112" fill="#a5b4c8">bitrateKbps  <tspan fill="#f1f5f9">1180</tspan></text>
      <text x="22" y="144" fill="#a5b4c8">viewers      <tspan fill="#f1f5f9">2</tspan></text>
      <text x="22" y="176" fill="#a5b4c8">dark camera  <tspan fill="#f1f5f9">online false</tspan></text>
    </g>
    <g class="mono" font-size="13">
      <rect x="350" y="64" width="64" height="24" rx="12" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="382" y="81" text-anchor="middle" fill="#22c55e">Good</text>
      <rect x="350" y="96" width="64" height="24" rx="12" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="382" y="113" text-anchor="middle" fill="#22c55e">Good</text>
      <rect x="350" y="128" width="64" height="24" rx="12" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="382" y="145" text-anchor="middle" fill="#22c55e">Good</text>
      <rect x="350" y="160" width="64" height="24" rx="12" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="382" y="177" text-anchor="middle" fill="#22c55e">Good</text>
    </g>
  </g>

  <!-- alarm → clip -->
  <g transform="translate(60 590)">
    <rect width="190" height="110" rx="14" fill="#172338" stroke="#f59e0b" stroke-width="2"/>
    <g transform="translate(40 26)">
      <path d="M20 0 C 6 0, 2 12, 2 24 L 2 40 L -4 48 L 44 48 L 38 40 L 38 24 C 38 12, 34 0, 20 0 Z" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="20" cy="55" r="5" fill="#f59e0b"/>
    </g>
    <text x="96" y="52" class="mono" font-size="14" fill="#f59e0b">high temp</text>
    <text x="96" y="74" class="mono" font-size="14" fill="#f59e0b">TRIPPED</text>
  </g>
  <path d="M254 645 L 340 645" stroke="#93c5fd" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(350 584)">
    <rect width="460" height="124" rx="12" fill="#131e33" stroke="#334a6e"/>
    <g fill="#0b1324" stroke="#334a6e">
      <rect x="18" y="22" width="78" height="52" rx="4"/><rect x="104" y="22" width="78" height="52" rx="4"/><rect x="190" y="22" width="78" height="52" rx="4" stroke="#f59e0b" stroke-width="2"/><rect x="276" y="22" width="78" height="52" rx="4"/><rect x="362" y="22" width="78" height="52" rx="4"/>
    </g>
    <g fill="#334a6e"><rect x="18" y="10" width="422" height="6" rx="3"/><rect x="18" y="80" width="422" height="6" rx="3"/></g>
    <text x="18" y="110" class="mono" font-size="14" fill="#a5b4c8">−10 s … +10 s  ·  MP4  ·  documents the alarm</text>
  </g>
</svg>
<div class="foot">CivOps · civops.io · MIT licensed · synthetic example data</div>
</body></html>
